name: publish-zh
run-name: "OpenCode 汉化版发布 ${{ inputs.version || 'auto' }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本号 (可选)"
        required: false
        type: string
      bump:
        description: "版本递增类型"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major

concurrency: publish-zh-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Build Windows binary
        run: |
          cd packages/opencode
          bun run script/build.ts --windows-only
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release artifacts
        run: |
          cd packages/opencode/dist
          Compress-Archive -Path opencode-zh-windows-x64/bin/* -DestinationPath opencode-zh-windows-x64.zip
          Compress-Archive -Path opencode-zh-windows-x64-baseline/bin/* -DestinationPath opencode-zh-windows-x64-baseline.zip
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-zh-windows
          path: |
            packages/opencode/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: opencode-zh-windows
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: opencode-zh-windows
          path: ./artifacts

      - name: Prepare npm package
        run: |
          # 创建 npm 包目录
          mkdir -p npm-package/bin
          
          # 解压 Windows 二进制
          unzip -o artifacts/opencode-zh-windows-x64.zip -d npm-package/bin
          mv npm-package/bin/opencode npm-package/bin/opencode-zh || true
          
          # 创建 package.json
          cat > npm-package/package.json << 'EOF'
          {
            "name": "opencode-zh",
            "version": "${GITHUB_REF_NAME#v}",
            "description": "OpenCode 汉化版 - AI 编程助手",
            "bin": {
              "opencode-zh": "./bin/opencode-zh"
            },
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/ev71h5n1-wq/opencode-zh"
            },
            "keywords": ["opencode", "ai", "coding", "assistant", "chinese"],
            "engines": {
              "node": ">=18"
            },
            "os": ["win32"],
            "cpu": ["x64"]
          }
          EOF
          
          # 复制 LICENSE
          cp LICENSE npm-package/ || true

      - name: Publish to npm
        run: |
          cd npm-package
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
