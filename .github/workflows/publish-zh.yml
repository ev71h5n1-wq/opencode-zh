name: publish-zh
run-name: "OpenCode 汉化版发布 ${{ inputs.version || 'auto' }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本号 (可选)"
        required: false
        type: string
      bump:
        description: "版本递增类型"
        required: false
        type: choice
        options:
          - patch
          - minor
          - major

concurrency: publish-zh-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Build Windows binary
        run: |
          cd packages/opencode
          bun run script/build.ts --windows-only
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release artifacts
        run: |
          cd packages/opencode/dist
          Compress-Archive -Path opencode-zh-windows-x64/bin/* -DestinationPath opencode-zh-windows-x64.zip -Force
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-zh-windows
          path: |
            packages/opencode/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: opencode-zh-windows
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare npm package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Publishing version: $VERSION"
          
          # 更新 package.json 版本号
          cd npm-publish
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
            console.log('Updated package.json version to:', '$VERSION');
          "
          
          # 确保脚本可执行
          chmod +x bin/opencode-zh.js
          chmod +x scripts/install.js

      - name: Publish to npm
        run: |
          cd npm-publish
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
